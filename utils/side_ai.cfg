#textdomain wesnoth-Trial_by_Fire

#--------------------
# GOALS AND AVOIDS
#--------------------
#define GOAL_AVOID_SIDE VALUE SIDE RADIUS
    {GOAL_LOCATION {VALUE} (
        [not]
            [filter]
                side={SIDE}
            [/filter]
            radius={RADIUS}
        [/not]
    )}
#enddef

#define GOAL_UNIT VALUE CRITERIA
    [goal]
        name=target_unit
        [criteria]
            {CRITERIA}
        [/criteria]
        value={VALUE}
    [/goal]
#enddef

#define GOAL_LOCATION_ID VALUE ID CRITERIA
    [goal]
        id={ID}
        name=target_location
        [criteria]
            {CRITERIA}
        [/criteria]
        value={VALUE}
    [/goal]
#enddef

#define GOAL_TERRAIN VALUE CRITERIA
    [goal]
        name=target_location
        [filter_location]
            {CRITERIA}
        [/filter_location]
        value={VALUE}
    [/goal]
#enddef

#define GOAL_LOCATION VALUE CRITERIA
    [goal]
        name=target_location
        [criteria]
            {CRITERIA}
        [/criteria]
        value={VALUE}
    [/goal]
#enddef

#define AVOID_SIDE SIDE RADIUS
    [avoid]
        [filter]
            side={SIDE}
        [/filter]
        radius={RADIUS}
    [/avoid]
#enddef

#--------------------
# SPECIFIC BEHAVIORS
#--------------------
# meant for similiar behavior to status=guardian, but with more customizability
#define ZONE_GUARDIAN X Y ENEMY_LOCATION
    [+unit]
        [ai]
            [micro_ai]
                ai_type=zone_guardian
                station_x,station_y={X},{Y}
                [filter_location]
                    {ENEMY_LOCATION}
                [/filter_location]
            [/micro_ai]
        [/ai]
    [/unit]
#enddef
#define VIP_GUARDIAN VIP_FILTER INNER_RADIUS OUTER_RADIUS
    [+unit]
        [ai]
            [micro_ai]
                ai_type=zone_guardian
                [filter_location]
                    radius={INNER_RADIUS}
                    [filter]
                        {VIP_FILTER}
                    [/filter]
                [/filter_location]
                [filter_location_enemy]
                    radius={OUTER_RADIUS}
                    [filter]
                        {VIP_FILTER}
                    [/filter]
                [/filter_location_enemy]
            [/micro_ai]
        [/ai]
    [/unit]
#enddef

#define SILENTLY_LIMIT_MOVES SIDE FLT MOVES
    [event]
        name=side {SIDE} turn refresh
        first_time_only=no
        [modify_unit]
            [filter]
                side={SIDE}
                {FLT}
            [/filter]
            moves={MOVES}
        [/modify_unit]
    [/event]
#enddef

#define LIMIT_RECRUITS_PER_TURN SIDES AMOUNT
    [event]
        name=side turn
        first_time_only=no
        [filter_condition]
            [have_unit]
                side=$side_number

                [and]
                    side={SIDES}
                [/and]
            [/have_unit]
        [/filter_condition]

        {VARIABLE recruits_this_turn 0}

        [event]
            name=turn end

            {CLEAR_VARIABLE recruits_this_turn}
        [/event]
    [/event]

    [event]
        name=recruit
        first_time_only=no
        [filter]
            side={SIDES}
        [/filter]

        {VARIABLE_OP recruits_this_turn add 1}

        [if]
            {VARIABLE_CONDITIONAL recruits_this_turn equals {AMOUNT}}
            [then]
                [store_side]
                    side=$side_number
                [/store_side]

                [disallow_recruit]
                    side=$side_number
                [/disallow_recruit]
                [event]
                    name=turn end

                    [allow_recruit]
                        side=$side.side
                        type=$side.recruit
                    [/allow_recruit]

                    {CLEAR_VARIABLE side}
                [/event]
            [/then]
        [/if]
    [/event]
#enddef

